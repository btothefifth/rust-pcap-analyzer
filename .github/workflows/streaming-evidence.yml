name: streaming-evidence-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require supported Python
        run: python -c "import sys; assert sys.version_info >= (3,11), sys.version"
      - name: Install the repository toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - name: Python contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools/tests -v
      - name: Root compatibility contracts
        run: |
          cargo test --locked --offline --all-targets
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: Streaming contracts and release build
        run: |
          cargo test --manifest-path streaming/Cargo.toml --locked --offline --all-targets
          cargo test --manifest-path streaming/Cargo.toml --locked --offline --release --all-targets
          cargo clippy --manifest-path streaming/Cargo.toml --locked --offline --all-targets -- -D warnings
          cargo fmt --manifest-path streaming/Cargo.toml --all -- --check
          cargo build --manifest-path streaming/Cargo.toml --locked --offline --release

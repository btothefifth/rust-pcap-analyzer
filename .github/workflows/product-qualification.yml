name: additive-product-qualification
on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'tests/**'
      - 'streaming/**'
      - 'product/**'
      - 'history/**'
      - 'history-app/**'
      - 'tools/**'
      - 'desktop/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'tests/**'
      - 'streaming/**'
      - 'product/**'
      - 'history/**'
      - 'history-app/**'
      - 'tools/**'
      - 'desktop/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.local-tooling/qualification-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Explicit test-only schema oracle provisioning (before offline gates)
        run: |
          python -m pip install --only-binary=:all: -r scripts/requirements-qualification.txt
      - name: Explicit toolchain provisioning (not part of runtime build)
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - name: Complete offline workspace, feature and independent-selector frontier
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CARGO_TARGET_DIR: ${{ runner.temp }}/pcap-qualification-target
        run: python scripts/validate_product.py --output "${{ runner.temp }}/pcap-product-qualification"
      - name: Retain exact-source qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-product-qualification-${{ runner.os }}
          path: ${{ runner.temp }}/pcap-product-qualification
          if-no-files-found: error

name: native-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - name: Independent fixture preflight and native validation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate.py
      - name: API documentation build
        run: cargo doc --locked --offline --no-deps
